```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turn Detection Model</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #1e293b 0%,
                    #0f172a 45%,
                    #020617 100%
                );

            color: #f8fafc;
        }

        .card {
            width: 100%;
            max-width: 470px;

            padding: 38px 34px;

            background: rgba(15, 23, 42, 0.9);

            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(14px);
        }

        .badge {
            display: inline-flex;
            align-items: center;

            padding: 7px 12px;
