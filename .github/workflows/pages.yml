name: Deploy Redirect Site to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tunnel_url:
        description: "Paste the new Cloudflare tunnel URL"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Cloudflare tunnel URL
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tunnel_url != '' }}
        env:
          TUNNEL_URL: ${{ inputs.tunnel_url }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          url = os.environ["TUNNEL_URL"].strip().rstrip("/")

          if not re.fullmatch(
              r"https://[A-Za-z0-9-]+\.trycloudflare\.com",
              url
          ):
              raise SystemExit(
                  f"Invalid Cloudflare tunnel URL: {url}"
              )

          path = Path("redirect/index.html")
          html = path.read_text()

          new_html, count = re.subn(
              r'const targetUrl = "[^"]*";',
              f'const targetUrl = "{url}";',
              html
          )

          if count != 1:
              raise SystemExit(
                  f"Expected to replace 1 targetUrl, replaced {count}"
              )

          path.write_text(new_html)

          print(f"Updated targetUrl to: {url}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./redirect/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
