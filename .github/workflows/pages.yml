        }

        .welcome {
            padding: 14px 16px;
            margin-bottom: 25px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.035);

            color: #cbd5e1;

            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 14px;
            font-weight: 600;
        }

        .optional {
            margin-left: 3px;

            color: #64748b;

            font-size: 12px;
            font-weight: 400;
        }

        input {
            width: 100%;

            padding: 13px 14px;
