name: Deploy Redirect Site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      tunnel_url:
        description: "Paste the current Cloudflare tunnel URL"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Insert Cloudflare tunnel URL
        env:
          TUNNEL_URL: ${{ inputs.tunnel_url }}

        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          url = os.environ["TUNNEL_URL"].strip().rstrip("/")

          if not re.fullmatch(
              r"https://[A-Za-z0-9-]+\.trycloudflare\.com",
              url
          ):
              raise SystemExit(
                  f"Invalid Cloudflare tunnel URL: {url}"
              )

          path = Path("redirect/index.html")

          html = path.read_text(encoding="utf-8")

          if "__TUNNEL_URL__" not in html:
              raise SystemExit(
                  "__TUNNEL_URL__ placeholder not found in redirect/index.html"
              )

          html = html.replace(
              "__TUNNEL_URL__",
              url
          )

          path.write_text(
              html,
              encoding="utf-8"
          )

          print(f"Tunnel URL set to: {url}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./redirect/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
