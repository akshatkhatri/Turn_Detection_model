    </style>
</head>

<body>

<div class="card">

    <div class="badge">
        AI • Turn Detection
    </div>

    <h1>Turn Detection Model</h1>

    <p class="description">
        A multimodal model that combines audio and text signals
        to detect conversational turn boundaries.
    </p>

    <div class="welcome">
        👋 Hey! I built this project and would love to know
        who's checking it out.
    </div>

    <div
        id="error-message"
        class="error"
    >
        The demo is currently unavailable. Please try again later.
    </div>

    <form id="visitor-form">

        <label for="name">
            Your name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="What should I call you?"
            autocomplete="name"
            maxlength="100"
            required
        >

        <label for="reason">
            What brings you here?
            <span class="optional">(optional)</span>
        </label>

        <input
            type="text"
            id="reason"
            name="reason"
            placeholder="Just curious, reviewing the project..."
            maxlength="300"
        >

        <button
            id="submit-button"
            type="submit"
        >
            Explore the model →
        </button>

    </form>

    <div class="footer">
        Thanks for checking out my project.
    </div>

</div>

<script>
    /*
        GitHub Actions replaces this placeholder
        with the current Cloudflare Quick Tunnel URL.
    */
    const targetUrl = "__TUNNEL_URL__";

    const form =
        document.getElementById("visitor-form");

    const submitButton =
        document.getElementById("submit-button");

    const errorMessage =
        document.getElementById("error-message");

    form.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            errorMessage.style.display = "none";

            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();

            const reason =
                document
                    .getElementById("reason")
                    .value
                    .trim();

            if (!name) {
                return;
            }

            /*
                If GitHub Actions failed to replace
                the placeholder, don't redirect.
            */
            if (
                !targetUrl ||
                targetUrl === "__TUNNEL_URL__"
            ) {
                errorMessage.style.display = "block";
                return;
            }

            try {

                const destination =
                    new URL(targetUrl);

                destination.searchParams.set(
                    "visitor_name",
                    name
                );

                if (reason) {
                    destination.searchParams.set(
                        "visitor_reason",
                        reason
                    );
                }

                submitButton.disabled = true;
                submitButton.textContent =
                    "Opening project...";

                window.location.replace(
                    destination.toString()
                );

            } catch (error) {

                console.error(
                    "Invalid target URL:",
                    error
                );

                errorMessage.style.display = "block";
            }
        }
    );
</script>

</body>
</html>
